<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dailly · whiteboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <div id="whiteboard" class="whiteboard"></div>

      <!--
        An empty board, beside the filled one, because the interesting bugs live
        here. A block with text gets its width from its content and hides a
        layout mistake; empty, it collapses — which is how an unclickable editor
        shipped once. jsdom lays nothing out, so this pane is the only place the
        naked eye can catch it.
      -->
      <h2 class="pane-title">vazio — deve dar para clicar e escrever</h2>
      <div id="whiteboard-empty" class="whiteboard"></div>

      <footer class="hints">
        <kbd>#</kbd><kbd>espaço</kbd> título &middot;
        <kbd>-</kbd> lista &middot;
        <kbd>1.</kbd> lista ordenada &middot;
        <kbd>[]</kbd> checkbox &middot;
        <kbd>Enter</kbd> novo bloco &middot;
        <kbd>Tab</kbd> indenta &middot;
        <kbd>Backspace</kbd> no início funde
        <br />
        <kbd>Shift</kbd>+<kbd>↑</kbd><kbd>↓</kbd> seleciona blocos &middot;
        <kbd>Ctrl</kbd>+<kbd>A</kbd> texto, depois tudo &middot;
        <kbd>Alt</kbd>+<kbd>↑</kbd><kbd>↓</kbd> move &middot;
        <kbd>Tab</kbd> / <kbd>Shift</kbd>+<kbd>Tab</kbd> ou <kbd>Ctrl</kbd>+<kbd>D</kbd> indenta
      </footer>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
