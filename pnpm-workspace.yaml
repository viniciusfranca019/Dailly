packages:
  - packages/*
  - ui
  - server

# Dependências autorizadas a rodar script de instalação. Sem isto o pnpm 11 as
# ignora em silêncio, e o sintoma aparece longe da causa: o better-sqlite3 sem
# o .node compilado, o tsx sem o esbuild.
allowBuilds:
  better-sqlite3: true
  electron: set this to true or false
  esbuild: true
